<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/public/ux.css">
  <script defer src="/public/ux.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NfinityHQ — Reset Password</title>
  <!-- ─── Security headers (set the same values at the edge/CDN as real HTTP headers) ─── -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <base href="/public/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="portal-body">

  <canvas id="galaxy"></canvas>
  <div class="orb" id="orb-1"></div>
  <div class="orb" id="orb-2"></div>

  <div class="login-card-wrap">
    <div class="login-card" style="max-width:420px">
      <div class="card-top-line"></div>
      <div class="card-glow"></div>

      <div class="card-header">
        <div class="logo">
          <span class="logo-n">N</span><span class="logo-rest">finityHQ</span>
          <div class="logo-dot"></div>
        </div>
        <p class="card-sub">Reset your password</p>
      </div>

      <p style="font-size:0.875rem;color:var(--text-2);font-weight:300;line-height:1.65;margin-bottom:22px;text-align:center;">
        Enter your registered email and we'll send a secure reset link to your inbox.
      </p>

      <div class="field-group">
        <label for="reset-email">Email Address</label>
        <div class="input-wrap">
          <svg class="input-icon" width="15" height="15" viewBox="0 0 15 15" fill="none">
            <path d="M2 4l5.5 4.5L13 4M2 4h11v9H2V4z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
          </svg>
          <input type="email" id="reset-email" placeholder="you@example.test"/>
        </div>
      </div>

      <button class="btn-primary btn-full" id="reset-request-btn" onclick="handleReset()" style="margin-top:4px">
        Send Reset Link
      </button>
      <p id="reset-request-message" style="min-height:1.4em;font-size:.82rem;color:var(--text-2);line-height:1.5;margin-top:14px;text-align:center"></p>

      <div style="text-align:center;margin-top:20px">
        <a href="index.html" style="font-size:0.82rem;color:var(--accent);font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:5px;opacity:0.85;transition:opacity 0.2s"
          onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.85'">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M8 2L4 6l4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          Back to Login
        </a>
      </div>
    </div>
  </div>

  <script src="runtime-config.js"></script>
  <script src="app.js"></script>
  <script>
    // Reset request handler.
    // SECURITY: Always show the same confirmation regardless of whether the
    // address is registered, so an attacker can't enumerate accounts. Validate
    // format client-side only as a UX courtesy.
    (function () {
      var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      var lastRequestAt = 0;

      function apiUrl(path) {
        var base = (window.NFINITY_API_BASE_URL || '').replace(/\/+$/, '');
        return base + path;
      }

      window.handleReset = function () {
        var input = document.getElementById('reset-email');
        var button = document.getElementById('reset-request-btn');
        var message = document.getElementById('reset-request-message');
        var email = (input && input.value || '').trim();
        if (!email || email.length > 254 || !EMAIL_RE.test(email)) {
          message.textContent = 'Please enter a valid email address.';
          message.style.color = '#f87171';
          return;
        }
        // Light client-side throttle so the button can't be mashed.
        var now = Date.now();
        if (now - lastRequestAt < 5000) return;
        lastRequestAt = now;
        button.disabled = true;
        fetch(apiUrl('/api/auth/forgot-password'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        })
          .then(function () {
            message.textContent = 'If an account exists, reset instructions have been sent.';
            message.style.color = 'var(--text-2)';
          })
          .catch(function () {
            message.textContent = 'If an account exists, reset instructions have been sent.';
            message.style.color = 'var(--text-2)';
          })
          .finally(function () {
            button.disabled = false;
          });
      };
    })();
  </script>
</body>
</html>

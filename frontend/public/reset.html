<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/public/ux.css">
  <script defer src="/public/ux.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NfinityHQ - Set New Password</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <base href="/public/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="portal-body">
  <canvas id="galaxy"></canvas>
  <div class="orb" id="orb-1"></div>
  <div class="orb" id="orb-2"></div>

  <div class="login-card-wrap">
    <div class="login-card" style="max-width:420px">
      <div class="card-top-line"></div>
      <div class="card-glow"></div>
      <div class="card-header">
        <div class="logo">
          <span class="logo-n">N</span><span class="logo-rest">finityHQ</span>
          <div class="logo-dot"></div>
        </div>
        <p class="card-sub">Choose a new password</p>
      </div>

      <form id="reset-form" novalidate>
        <div class="field-group">
          <label for="new-password">New Password</label>
          <div class="input-wrap">
            <input type="password" id="new-password" autocomplete="new-password" minlength="8" required style="padding-left:14px"/>
          </div>
        </div>
        <div class="field-group">
          <label for="confirm-password">Confirm Password</label>
          <div class="input-wrap">
            <input type="password" id="confirm-password" autocomplete="new-password" minlength="8" required style="padding-left:14px"/>
          </div>
        </div>
        <p id="reset-message" style="min-height:1.4em;font-size:.82rem;color:var(--text-2);line-height:1.5;margin-bottom:16px;text-align:center"></p>
        <button type="submit" class="btn-primary btn-full" id="reset-submit">Update Password</button>
      </form>
    </div>
  </div>

  <script src="runtime-config.js"></script>
  <script src="app.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token') || '';
      var form = document.getElementById('reset-form');
      var msg = document.getElementById('reset-message');
      var btn = document.getElementById('reset-submit');


      function apiUrl(path) {
        var base = (window.NFINITY_API_BASE_URL || '').replace(/\/+$/, '');
        return base + path;
      }

      function setMessage(text, isError) {
        msg.textContent = text;
        msg.style.color = isError ? '#f87171' : 'var(--text-2)';
      }

      if (!token) {
        btn.disabled = true;
        setMessage('Reset link is missing or invalid.', true);
        return;
      }

      fetch(apiUrl('/api/auth/reset-password?token=' + encodeURIComponent(token)))
        .then(function (res) { return res.json(); })
        .then(function (body) {
          if (!body.valid) {
            btn.disabled = true;
            setMessage('Reset link is invalid or expired.', true);
          }
        })
        .catch(function () {
          btn.disabled = true;
          setMessage('Unable to verify this reset link right now.', true);
        });

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var password = document.getElementById('new-password').value;
        var confirm = document.getElementById('confirm-password').value;
        if (password.length < 8) return setMessage('Password must be at least 8 characters.', true);
        if (password !== confirm) return setMessage('Passwords do not match.', true);

        btn.disabled = true;
        fetch(apiUrl('/api/auth/reset-password'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, password: password })
        })
          .then(function (res) {
            if (!res.ok) throw new Error('reset failed');
            setMessage('Password updated. You can sign in now.', false);
            setTimeout(function () { window.location.href = 'login.html'; }, 1200);
          })
          .catch(function () {
            btn.disabled = false;
            setMessage('Reset link is invalid or expired.', true);
          });
      });
    })();
  </script>
</body>
</html>
